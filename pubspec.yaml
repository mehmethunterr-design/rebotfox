name: rebotfox
description: Rebotfox professional technical service application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  image_picker: ^0.8.8+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/rebotfox_logo_round.png
    - assets/images/rebotfox_app_icon.png
    - assets/images/rebotfox_splash.png
